<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>Menu</h2>

        <ul>
            <li>📅 Today</li>
            <li>📌 Upcoming</li>
            <li>⭐ Someday</li>
            <li>🕒 Anytime</li>
        </ul>
        <div class="task-list">

            <!-- JavaScript tasks --->

        </div>
    </aside>

    <!-- Main Section -->
    <main class="main-content">

        <h1>To Do List</h1>

        <div class="add-task">

    <div class="input-row">

        <div class="task-box">
             <label for="task" class="task-label">Task :</label>
            <input
                type="text"
                class="task-input"
                placeholder="Enter your task" id="task">
            <p class="task-error"></p>
        </div>

        <div class="time-box">
            <label for="time" class="time-label">Time :</label>
            <input
                type="time"
                class="time-input"
                id="time">
           
             <p class="time-error"></p>
        </div>
        <!-- <div class="taskBtn"> -->
        <button class="add-btn">
            Add Task
        </button>
        <!-- </div> -->
    </div>

</div>

        <div class="filter">

            <button class="all-btn">All</button>
            <button class="pending-btn">Pending :</button>
            <button class="completed-btn">Completed :</button>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
